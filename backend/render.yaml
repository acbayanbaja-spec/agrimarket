services:
  - type: web
    name: agrimarket-backend
    env: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: 4000
      - key: DB_NAME
        value: agrimarket
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://agrimarket-platform.vercel.app,https://agrimarket.vercel.app,exp://localhost:19000,http://localhost:5173
      - key: FRONTEND_URL
        value: https://agrimarket-platform.vercel.app
      - key: MOBILE_URL
        value: exp://localhost:19000
      - key: DB_REQUIRED
        value: "true"
      - key: ALLOW_EMBEDDED_STORE
        value: "false"
      - key: DATABASE_URL
        sync: false
