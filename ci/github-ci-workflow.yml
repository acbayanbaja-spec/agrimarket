name: AgriMarket CI

on:
  push:
    branches: [ deploy-ready, main ]
  pull_request:
    branches: [ deploy-ready, main ]

jobs:
  backend:
    name: Backend Build & Security Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Security, RBAC & Concurrency Verification Suite
        run: npm run test:verify
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production-1234567890

  web:
    name: Web Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
